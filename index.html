<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Rakha | محمل فيديوهات السوشيال ميديا</title>
    <!-- استدعاء نظام التصميم Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* خلفية دارك مود فخمة */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
        }
        /* كارت الموقع بتأثير زجاجي وإضاءة حمراء خفيفة */
        .main-card {
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            background: #1f2128;
            box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.2);
        }
        /* تعديل حقل الإدخال ليتماشى مع الدارك مود */
        .form-control {
            background-color: #12141c !important;
            border: 2px solid #33363f !important;
            color: #ffffff !important;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #ff003c !important;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.5) !important;
        }
        /* زر أحمر مميز */
        .btn-red {
            background-color: #ff003c;
            color: white;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-red:hover {
            background-color: #d60032;
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.7);
        }
        /* زر التحميل النهائي بلون أحمر متوهج */
        .btn-download {
            background-color: #240008;
            color: #ff3366;
            border: 2px solid #ff003c;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            background-color: #ff003c;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.8);
        }
        /* تخصيص الـ Spinner ليكون أحمر */
        .spinner-border {
            color: #ff003c !important;
        }
        .brand-title {
            color: #ff003c;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
        }
        .loading-spinner { display: none; }
        .alert-custom-danger {
            background-color: #2c0b0e;
            color: #ff6b7a;
            border: 1px solid #ff003c;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card text-center">
            <!-- اسمك منور في نص الموقع -->
            <h1 class="brand-title mb-2">Omar Rakha</h1>
            <h4 class="mb-4 text-light">مُحمل فيديوهات السوشيال ميديا 🎬</h4>
            <p class="text-muted small">حمل من: TikTok, Instagram, Facebook, YouTube, X (Twitter)</p>
            
            <!-- حقل الرابط -->
            <div class="mt-4">
                <div class="mb-3">
                    <input type="url" id="videoUrl" class="form-control form-control-lg text-center" placeholder="انسخ رابط الفيديو وضعه هنا..." required>
                </div>
                <button onclick="downloadVideo()" class="btn btn-red btn-lg w-100" id="btnSubmit">استخراج الفيديو المباشر 📥</button>
            </div>

            <!-- مؤشر الانتظار -->
            <div class="loading-spinner mt-4" id="spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 text-muted">جاري سحب الفيديو من السيرفر، ثواني يا حب...</p>
            </div>

            <!-- النتيجة -->
            <div id="resultArea" class="mt-4"></div>
        </div>
    </div>

    <!-- كود الجافا سكريبت لجلب روابط السوشيال ميديا -->
    <script>
        async function downloadVideo() {
            const videoUrl = document.getElementById('videoUrl').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const spinner = document.getElementById('spinner');
            const resultArea = document.getElementById('resultArea');

            if (!videoUrl) {
                alert('حط الرابط الأول يا غالي!');
                return;
            }

            btnSubmit.disabled = true;
            spinner.style.display = 'block';
            resultArea.innerHTML = '';

            try {
                // استخدام API من cobalt لجلب الروابط مباشرة
                const response = await fetch('https://api.cobalt.tools/', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: videoUrl,
                        vQuality: '720'
                    })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'picker' || data.url) {
                    const finalUrl = data.url;
                    resultArea.innerHTML = `
                        <div class="text-success mb-3">✨ تم تجهيز الفيديو بنجاح!</div>
                        <a href="${finalUrl}" target="_blank" class="btn btn-download btn-lg w-100">اضغط هنا لبدء التحميل الفوري 🚀</a>
                    `;
                } else {
                    resultArea.innerHTML = `<div class="alert alert-custom-danger">عذراً، لم نتمكن من جلب هذا الفيديو. تأكد من الرابط وجرب تاني.</div>`;
                }

            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="alert alert-custom-danger">حدث خطأ في الاتصال، تأكد من إن الرابط شغال أو جرب لاحقاً.</div>`;
            } finally {
                btnSubmit.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
