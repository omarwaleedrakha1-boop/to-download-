<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Rakha | محمل فيديوهات السوشيال ميديا المحترف</title>
    <!-- استدعاء نظام التصميم Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* خلفية دارك مود فخمة */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
        }
        /* كارت الموقع بإضاءة نيون حمراء */
        .main-card {
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            background: #1f2128;
            box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.25);
        }
        /* تعديل حقل الإدخال */
        .form-control {
            background-color: #12141c !important;
            border: 2px solid #33363f !important;
            color: #ffffff !important;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #ff003c !important;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.6) !important;
        }
        /* زر أحمر مميز */
        .btn-red {
            background-color: #ff003c;
            color: white;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-red:hover {
            background-color: #d60032;
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.8);
        }
        /* أزرار التحميل النهائية المتوهجة */
        .btn-download {
            background-color: #240008;
            color: #ff3366;
            border: 2px solid #ff003c;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            background-color: #ff003c;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.9);
        }
        .spinner-border {
            color: #ff003c !important;
        }
        .brand-title {
            color: #ff003c;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(255, 0, 60, 0.4);
        }
        .loading-spinner { display: none; }
        .alert-custom-danger {
            background-color: #2c0b0e;
            color: #ff6b7a;
            border: 1px solid #ff003c;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card text-center">
            <!-- اسم البراند بتاعك -->
            <h1 class="brand-title mb-2">Omar Rakha</h1>
            <h4 class="mb-4 text-light">مُحمل فيديوهات السوشيال ميديا 🎬</h4>
            
            <!-- التطبيقات الأربعة المطلوبة -->
            <div class="d-flex justify-content-center gap-2 mb-4 small">
                <span class="badge bg-dark border border-danger px-3 py-2">تيك توك</span>
                <span class="badge bg-dark border border-danger px-3 py-2">إنستجرام</span>
                <span class="badge bg-dark border border-danger px-3 py-2">فيسبوك</span>
                <span class="badge bg-dark border border-danger px-3 py-2">تويتر (X)</span>
            </div>
            
            <!-- حقل إدخال الرابط -->
            <div class="mt-4">
                <div class="mb-3">
                    <input type="url" id="videoUrl" class="form-control form-control-lg text-center" placeholder="ضع رابط الفيديو المراد تحميله هنا..." required>
                </div>
                <button onclick="downloadVideo()" class="btn btn-red btn-lg w-100" id="btnSubmit">تحميل الفيديو الآن 📥</button>
            </div>

            <!-- مؤشر الانتظار المتناسق -->
            <div class="loading-spinner mt-4" id="spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 text-muted">جاري الاتصال بالسيرفر وسحب الفيديو، لحظات يا غالي...</p>
            </div>

            <!-- منطقة ظهور روابط التحميل -->
            <div id="resultArea" class="mt-4"></div>
        </div>
    </div>

    <!-- كود الربط الذكي مع السيرفر السريع -->
    <script>
        async function downloadVideo() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const btnSubmit = document.getElementById('btnSubmit');
            const spinner = document.getElementById('spinner');
            const resultArea = document.getElementById('resultArea');

            if (!videoUrl) {
                alert('من فضلك حط رابط الفيديو الأول!');
                return;
            }

            btnSubmit.disabled = true;
            spinner.style.display = 'block';
            resultArea.innerHTML = '';

            // بيانات التوكن والـ API المستخرجة من سكريبت السيرفر
            const apiUrl = 'https://snaptwitt.com/wp-json/aiodl/v1/video';
            const secToken = '5215e7c9163d493548af85315d9db2446c81cc51730272dfe841ffec337c0c9a';

            try {
                // إرسال الطلب للسيرفر بنفس الطريقة الموثوقة للموقع الأصلي
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-WP-Nonce': 'ed7e9c3ea8' // الـ Nonce الممرر في طلبات الووردبريس
                    },
                    body: JSON.stringify({
                        url: videoUrl,
                        token: secToken
                    })
                });

                const data = await response.json();

                // التحقق من استجابة السيرفر وعرض الروابط المباشرة بناءً عليها
                if (data && (data.url || data.links)) {
                    let htmlContent = `<div class="text-success mb-3">✨ تم العثور على الفيديو بنجاح! جاهز للتحميل:</div>`;
                    
                    // لو السيرفر مطلع كذا جودة (عالي / متوسط)
                    if (data.links && data.links.length > 0) {
                        data.links.forEach(link => {
                            htmlContent += `
                                <a href="${link.url}" target="_blank" download class="btn btn-download btn-lg w-100 mb-2">
                                    تحميل بجودة (${link.quality || 'عالية'}) 🚀
                                </a>`;
                        });
                    } else if (data.url) {
                        // رابط منفرد مباشر
                        htmlContent += `<a href="${data.url}" target="_blank" download class="btn btn-download btn-lg w-100">اضغط هنا لبدء التحميل الفوري 🚀</a>`;
                    }
                    
                    resultArea.innerHTML = htmlContent;
                } else if (data.message) {
                    resultArea.innerHTML = `<div class="alert alert-custom-danger">السيرفر بيقول: ${data.message}</div>`;
                } else {
                    resultArea.innerHTML = `<div class="alert alert-custom-danger">تأكد من صحة الرابط، أو أن الفيديو ليس في حساب خاص (Private).</div>`;
                }

            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="alert alert-custom-danger">حدث خطأ أثناء فك تشفير الرابط. جرب مرة أخرى أو تأكد من اتصالك بالإنترنت.</div>`;
            } finally {
                btnSubmit.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
