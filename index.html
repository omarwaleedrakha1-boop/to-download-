<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Rakha | محمل فيديوهات السوشيال ميديا الأسرع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* خلفية دارك مود فخمة وجذابة */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
        }
        /* كارت الموقع الرئيسي متوهج باللون الأحمر النيون */
        .main-card {
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 24px;
            background: #1f2128;
            box-shadow: 0 10px 40px rgba(255, 0, 60, 0.2);
            border: 1px solid rgba(255, 0, 60, 0.3);
        }
        /* تصميم حقول الإدخال متناسق مع النيون */
        .form-control {
            background-color: #12141c !important;
            border: 2px solid #33363f !important;
            color: #ffffff !important;
            padding: 14px !important;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #ff003c !important;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.6) !important;
        }
        /* زر أحمر متوهج قوي */
        .btn-red {
            background-color: #ff003c;
            color: white;
            font-weight: bold;
            padding: 14px !important;
            border: none;
            border-radius: 12px !important;
            transition: all 0.3s ease;
        }
        .btn-red:hover {
            background-color: #d60032;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.8);
        }
        /* أزرار تحميل النتيجة النهائية */
        .btn-download {
            background-color: #240008;
            color: #ff3366;
            border: 2px solid #ff003c;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            background-color: #ff003c;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.9);
        }
        .brand-title {
            color: #ff003c;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
        }
        .badge-app {
            background-color: #12141c;
            border: 1px solid rgba(255, 0, 60, 0.4);
            color: #ff6b7a;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .spinner-border {
            color: #ff003c !important;
        }
        .loading-spinner { display: none; }
        .alert-custom-danger {
            background-color: #2c0b0e;
            color: #ff6b7a;
            border: 1px solid #ff003c;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card text-center">
            <h1 class="brand-title mb-2">Omar Rakha</h1>
            <h5 class="mb-4 text-light-50">⚡ نظام تحميل فيديوهات السوشيال ميديا الخارق ⚡</h5>
            
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                <span class="badge-app">𝕏 تويتر</span>
                <span class="badge-app">🎵 تيك توك</span>
                <span class="badge-app">📸 إنستجرام</span>
                <span class="badge-app">📘 فيسبوك</span>
            </div>
            
            <div class="mt-4">
                <div class="mb-3">
                    <input type="url" id="videoUrl" class="form-control text-center" placeholder="انسخ رابط الفيديو وضعه هنا بالكامل..." required>
                </div>
                <button onclick="processDownload()" class="btn btn-red btn-lg w-100" id="btnSubmit">ابدأ استخراج الفيديو الآن 📥</button>
            </div>

            <div class="loading-spinner mt-4" id="spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 text-muted">جاري سحب الفيديو وفك التشفير، ثواني يا غالي...</p>
            </div>

            <div id="resultArea" class="mt-4"></div>
        </div>
    </div>

    <script>
        async function processDownload() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const btnSubmit = document.getElementById('btnSubmit');
            const spinner = document.getElementById('spinner');
            const resultArea = document.getElementById('resultArea');

            if (!videoUrl) {
                alert('من فضلك ضع رابط فيديو صحيح أولاً يا غالي!');
                return;
            }

            btnSubmit.disabled = true;
            spinner.style.display = 'block';
            resultArea.innerHTML = '';

            try {
                // إرسال الطلب لـ Cobalt API المستقر والمفتوح بدون قيود حماية الـ Cookies
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: videoUrl,
                        vQuality: '720',
                        filenamePattern: 'classic',
                        isAudioOnly: false,
                        isNoTTWatermark: true // إزالة علامة تيك توك المائية تلقائياً
                    })
                });

                const data = await response.json();

                // التحقق من استجابة النظام وطباعة الأزرار الحمراء الفخمة للتحميل المباشر
                if (data.url) {
                    resultArea.innerHTML = `
                        <div class="text-success mb-3">🔥 تم تجهيز الفيديو بنجاح:</div>
                        <a href="${data.url}" target="_blank" download class="btn btn-download btn-lg w-100">📥 اضغط هنا للتحميل الفوري</a>
                    `;
                } else if (data.picker && data.picker.length > 0) {
                    // لو المنصة الممررة رجعت خيارات وجودات متعددة
                    let htmlCard = `<div class="text-success mb-3">🔥 تم العثور على جودات متعددة:</div>`;
                    data.picker.forEach((item, index) => {
                        htmlCard += `
                            <a href="${item.url}" target="_blank" class="btn btn-download btn-lg w-100 mb-2">
                                📥 تحميل جودة رقم (${index + 1})
                            </a>`;
                    });
                    resultArea.innerHTML = htmlCard;
                } else if (data.text) {
                    resultArea.innerHTML = `<div class="alert alert-custom-danger">تنبيه من السيرفر: ${data.text}</div>`;
                } else {
                    resultArea.innerHTML = `<div class="alert alert-custom-danger">عذراً، تأكد من أن حساب الفيديو "عام وليس خاص" أو تأكد من صحة الرابط.</div>`;
                }

            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `<div class="alert alert-custom-danger">حدث خطأ في جلب البيانات، تأكد من نسخ رابط المشاركة الفعلي للفيديو.</div>`;
            } finally {
                btnSubmit.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
